spring.application.name=billing-service
server.port=${PORT:8083}


management.endpoints.web.exposure.include=health,info
logging.level.root=INFO


# Service URLs (Default to Cloud Run, override via env vars)
product.service.url=${PRODUCT_SERVICE_URL:https://product-service-949402843265.asia-southeast1.run.app}
vendor.service.url=${VENDOR_SERVICE_URL:https://vendor-service-949402843265.asia-southeast1.run.app}
staff.service.url=${STAFF_SERVICE_URL:https://staff-service-949402843265.asia-southeast1.run.app}

# Logging (for debugging)
logging.level.com.Billing.Software.billing_service=DEBUG
logging.level.org.springframework.security=DEBUG
