spring.application.name=Gate-way
server.port=${PORT:8080}

# Actuator Configuration for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.probes.enabled=true

# Server configuration
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Product service route
spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/products,/api/products/**

# Billing service route
spring.cloud.gateway.routes[1].id=billing-service
spring.cloud.gateway.routes[1].uri=${BILLING_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/billing,/api/billing/**

# Vendor service route
spring.cloud.gateway.routes[2].id=vendor-service
spring.cloud.gateway.routes[2].uri=${VENDOR_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/vendors,/api/vendors/**

# Staff service route
spring.cloud.gateway.routes[3].id=staff-service
spring.cloud.gateway.routes[3].uri=${STAFF_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/staff,/api/staff/**

# CORS Configuration - Production Ready
spring.cloud.gateway.globalcors.add-to-chain-proxy=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600
